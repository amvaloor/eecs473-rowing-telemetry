; PlatformIO Project Configuration File

[platformio]
; Force PlatformIO to build your NodeMCU settings instead of the 'oar' unit
default_envs = nodemcu-32s

; Shared configuration for all target environments
[env]
platform = espressif32
framework = arduino
lib_extra_dirs = components
lib_deps = 
    adafruit/Adafruit BNO08x

; --- WE ARE BYPASSING THESE THREE FOR NOW ---
; [env:oar]
; board = esp32dev
; build_src_filter = -<*> +<oar/>

; [env:central]
; board = esp32dev
; build_src_filter = -<*> +<central/>

; [env:coach]
; board = esp32dev
; build_src_filter = -<*> +<coach/>
; -------------------------------------------

[env:nodemcu-32s]
board = nodemcu-32s
monitor_speed = 115200
board_build.flash_mode = dio
; Force this environment to look at your standard main.cpp file!
build_src_filter = +<*> -<oar/> -<central/> -<coach/>
