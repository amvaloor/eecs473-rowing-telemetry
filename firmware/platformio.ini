; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = oar

; Shared configuration for all target environments
[env]
platform = espressif32
framework = arduino
lib_extra_dirs = components
lib_deps = 
    adafruit/Adafruit BNO08x

; Role 1: Oar Unit
[env:oar]
board = esp32dev
build_src_filter =
    -<*>
    +<oar/*.c>
    +<oar/*.cpp>
    +<oar/**/*.c>
    +<oar/**/*.cpp>

; Role 2: Central Unit
[env:central]
board = esp32dev
build_src_filter =
    -<*>
    +<central/*.c>
    +<central/*.cpp>
    +<central/**/*.c>
    +<central/**/*.cpp>

; Role 3: Coach Unit
[env:coach]
board = esp32dev
build_src_filter =
    -<*>
    +<coach/*.c>
    +<coach/*.cpp>
    +<coach/**/*.c>
    +<coach/**/*.cpp>
