; PlatformIO Project Configuration File

[platformio]
; Force PlatformIO to build your NodeMCU settings instead of the 'oar' unit
default_envs = nodemcu-32s

; Shared configuration for all target environments
[env]
platform = espressif32
framework = arduino
lib_extra_dirs = components
lib_deps = 
    adafruit/Adafruit BNO08x

; Role 1: Oar Unit
[env:oar]
board = esp32dev
build_src_filter =
    -<*>
    +<oar/*.c>
    +<oar/*.cpp>
    +<oar/**/*.c>
    +<oar/**/*.cpp>

; Role 2: Central Unit
[env:central]
board = esp32dev
build_src_filter =
    -<*>
    +<central/*.c>
    +<central/*.cpp>
    +<central/**/*.c>
    +<central/**/*.cpp>

; [env:coach]
; board = esp32dev
; build_src_filter = -<*> +<coach/>
; -------------------------------------------

[env:nodemcu-32s]
board = nodemcu-32s
monitor_speed = 115200
board_build.flash_mode = dio
; Force this environment to look at your standard main.cpp file!
build_src_filter =
    +<*>
    +<coach/*.c>
    +<coach/*.cpp>
    +<coach/**/*.c>
    -<oar/> -<central/> -<coach/**/*.cpp>
